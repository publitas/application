{{- if .Values.migration.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
  {{- include "application.labels" $ | nindent 4 }}
  {{- with .Values.migration.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.migration.useGenerateName }}
  generateName: {{ include "application.name" . }}-migrate-
  {{- else }}
  name: {{ include "application.name" . }}-migrate
  {{- end }}
  namespace: {{ include "application.namespace" . }}
spec:
  {{- if not (kindIs "invalid" .Values.migration.backoffLimit) }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  {{- end }}
  template:
    metadata:
      labels:
      {{- include "application.labels" $ | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.migration.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: migrate
        {{- $image := required "Undefined image repo for migration job" .Values.migration.image.repository }}
        {{- with .Values.migration.image.tag    }} {{- $image = print $image ":" . }} {{- end }}
        {{- with .Values.migration.image.digest }} {{- $image = print $image "@" . }} {{- end }}
        image: {{ $image }}
        {{- if .Values.migration.image.imagePullPolicy }}
        imagePullPolicy: {{ .Values.migration.image.imagePullPolicy }}
        {{- end }}
        {{- if .Values.migration.env }}
        env:
        {{- range $key, $value := .Values.migration.env }}
        - name: {{ include "application.tplvalues.render" ( dict "value" $key "context" $ ) }}
{{ include "application.tplvalues.render" ( dict "value" $value "context" $ ) | indent 10 }}
        {{- end }}
        {{- end }}
        {{- with .Values.migration.envFrom }}
        envFrom:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- if .Values.migration.command }}
        command: {{- include "application.tplvalues.render" (dict "value" .Values.migration.command "context" $) | nindent 10 }}
        {{- end }}
        {{- with .Values.migration.args }}
        args:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.migration.volumeMounts }}
        volumeMounts:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- with .Values.migration.volumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}

